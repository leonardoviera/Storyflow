# Target location: infra/litellm/config.yaml
# Constitution I (v2.0.0): self-hosted backends only — on this machine or a server on your private
# network. The backend is set in .env (LLM_MODEL, LLM_API_BASE, LLM_API_KEY) and checked by
# scripts/lint-config.mjs: cloud providers and public api_base hosts are rejected.

model_list:
  - model_name: local-llm                 # the only alias the app requests
    litellm_params:
      model: os.environ/LLM_MODEL         # e.g. hosted_vllm/qwen2.5-14b-instruct, openai/<name>
      api_base: os.environ/LLM_API_BASE   # e.g. http://192.168.1.50:8000/v1 (private address)
      api_key: os.environ/LLM_API_KEY     # your server's own key, or "none"

mcp_servers:
  blender_mcp:
    url: "http://blender-mcp:8000/mcp"
    transport: "http"

litellm_settings:
  telemetry: false
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
